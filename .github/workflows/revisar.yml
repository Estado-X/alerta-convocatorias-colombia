name: Revisar convocatorias

# Revisión una vez al día: está programada a las 4:17 a. m. (hora de Colombia). El minuto 17 es a propósito:
# GitHub recomienda no programar al inicio de la hora, que es cuando más se retrasa. Aun así puede correrla
# varias horas después cuando tiene mucha carga. Para apagarla, poner "# " al inicio de las dos líneas de schedule.
# El grupo de concurrencia «revisar-convocatorias» lo comparte con abrir-v2.yml para que no corran a la vez.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: revisar-convocatorias
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Revisar las páginas de fuentes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Para no abrir avisos en GitHub, cambia "si" por "no".
          AVISOS_GITHUB: "si"
        run: python -I scripts/revisar.py
      - name: Revisar la lista aparte de becas de doctorado (fuentes-doctorado.txt)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AVISOS_GITHUB: "si"
        run: python -I scripts/revisar.py --lista doctorado
      - name: Guardar los resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Revisión de convocatorias $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
